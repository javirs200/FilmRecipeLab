name: Crear release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión que se publicará (sin prefijo v)
        required: true
        default: "1.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publicar FilmRecipe Lab
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validar versión
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw "La versión debe tener formato X.Y o X.Y.Z, por ejemplo 1.0."
          }

          "RELEASE_TAG=v$env:RELEASE_VERSION" >> $env:GITHUB_ENV

      - name: Ejecutar pruebas
        run: dotnet test FilmRecipeLab.sln --configuration Release

      - name: Publicar ejecutable autónomo
        shell: pwsh
        run: >-
          dotnet publish src/FilmRecipeLab.Presentation/FilmRecipeLab.Presentation.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          "-p:Version=$env:RELEASE_VERSION"
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/FilmRecipeLab

      - name: Crear release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FilmRecipe Lab ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: publish/FilmRecipeLab/FilmRecipeLab.exe
          fail_on_unmatched_files: true